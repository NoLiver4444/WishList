services:
  # PostgreSQL база данных (миграции применяет бэкенд при старте)
  postgres:
    image: postgres:15-alpine
    container_name: wishlist-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-wishpiece}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт доступен только с локальной машины (для psql/IDE).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-wishpiece}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wishlist-network

  # Go бэкенд API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: wishlist-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-wishpiece}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - wishlist-network
    restart: unless-stopped

  # React фронтенд (Nginx, проксирует /api на бэкенд)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET:-}
    container_name: wishlist-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - wishlist-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  wishlist-network:
    driver: bridge
